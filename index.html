<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080d1c" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox='0%200%2016%2016'%3E%3Cpath%20fill='%2383f1d4'%20d='M1%2015L8%201L15%2015Z'%2F%3E%3C%2Fsvg%3E" />
    <title>Orbit Defender · 궤도 방어</title>
  </head>
  <body>
    <main class="mission">
      <header class="masthead">
        <div>
          <p class="eyebrow">ORBITAL DEFENSE / 01</p>
          <h1>Orbit Defender <span>궤도 방어</span></h1>
        </div>
        <div class="scoreboard"><span>점수</span><output id="score" aria-label="점수">0</output></div>
      </header>
      <div class="settings" role="group" aria-label="게임 설정">
        <label for="difficulty">다음 게임 난이도</label>
        <select id="difficulty" aria-describedby="difficulty-current">
          <option value="easy">쉬움</option>
          <option value="normal" selected>보통</option>
          <option value="hard">어려움</option>
        </select>
        <p id="difficulty-current">선택 난이도: 보통</p>
      </div>
      <section class="arena" aria-label="궤도 방어 게임">
        <canvas id="game" width="800" height="600" aria-label="800×600 우주 방어 게임 화면" aria-describedby="controls status">
          이 게임은 Canvas를 지원하는 데스크톱 브라우저에서 실행할 수 있습니다.
        </canvas>
        <div id="overlay" class="overlay">
          <div class="briefing">
            <p class="eyebrow">MISSION BRIEFING</p>
            <h2 id="message">궤도를 지켜 주세요</h2>
            <p id="detail">24개의 적을 모두 격추하세요.<br />적이 방어선에 닿으면 임무가 종료됩니다.</p>
            <button id="start" type="button">방어 시작 <span>↵ ENTER</span></button>
            <button id="restart" type="button" hidden>다시 도전 <span>R</span></button>
          </div>
        </div>
      </section>
      <footer class="dashboard">
        <p id="status" role="status" aria-live="polite">출격 대기</p>
        <p id="controls"><kbd>←</kbd> <kbd>→</kbd> / <kbd>A</kbd> <kbd>D</kbd> 이동 <span>·</span> <kbd>SPACE</kbd> 발사 <span>·</span> <kbd>P</kbd> 일시정지/재개</p>
      </footer>
      <p class="footnote">적 1개 = 10점 · 모두 격추하면 240점 · 종료 후 R로 다시 도전<br />화면을 벗어나면 누른 키가 해제됩니다.</p>
      <p id="error" role="alert" hidden></p>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
